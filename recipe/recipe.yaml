schema_version: 1

context:
  python_min: "3.11"
  version: "0.2.0"

package:
  name: arm-adapt
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/arm-adapt/arm_adapt-${{ version }}.tar.gz
  sha256: 7bf68c3cde5d68258f9b1758d80458fd64254414b2f0b0a4d8094aaabb4c908e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - adapt = adapt.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - wheel
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - xarray
    - pandas
    - scipy
    - scikit-image
    - matplotlib-base
    - networkx
    - h5py
    - netcdf4
    - tqdm
    - pydantic >=2.0
    - pyyaml
    - arm_pyart
    - opencv
    - boto3
    - pyarrow
    - python-duckdb

tests:
  - python:
      imports:
        - adapt
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - pip check
      - adapt --help

about:
  summary: Real-Time Analysis, Tracking, and Adaptive Radar Sampling of Convective Storms
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://arm-doe.github.io/Adapt/
  documentation: https://arm-doe.github.io/Adapt/

extra:
  recipe-maintainers:
    - zssherman
    - RBhupi
